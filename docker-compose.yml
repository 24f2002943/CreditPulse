version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: creditpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creditpulse_user
      POSTGRES_PASSWORD: creditpulse_pass
      POSTGRES_DB: creditpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditpulse_user -d creditpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://creditpulse_user:creditpulse_pass@postgres:5432/creditpulse_db
      - SECRET_KEY=docker_dev_secret_key_creditpulse_2026
      - ENVIRONMENT=development
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
